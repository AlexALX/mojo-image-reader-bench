[workspace]
name = "image_reader_benchmark"
version = "1.0.0"
description = "Benchmarks for Mojo-native image decoding library"
authors = ["AlexALX"]
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
pandas = "*"
matplotlib = "*"
mojo = "1.0.*"

[tasks]
build = "mkdir -p build && mojo build -I ./imagelib/ -O3 ./benchmark/imagelib_bench.mojo -o ./build/imagelib_bench"
bench = "./run_bench.sh > log.txt"
plot = "python bench_graph.py"
all = { depends-on = ["build", "bench", "plot"] }